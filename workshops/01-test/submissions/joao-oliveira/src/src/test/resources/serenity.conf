serenity {
  project.name = "Serenity BDD - Workshop 01 - João Oliveira"
  # Tira um print da tela depois de cada passo (aparece no relatório)
  take.screenshots = AFTER_EACH_STEP
  # O console mostra só os passos do Cucumber (plugin "pretty")
  logging = QUIET
}

# Nos cenários, "ela" e "ele" se referem ao último ator citado (a Ana)
screenplay.pronouns = "ela,ele"

# Use -Dheadless.mode=false para ver o Chrome abrindo na tela
headless.mode = true

webdriver {
  driver = chrome
  capabilities {
    browserName = "chrome"
    "goog:chromeOptions" {
      args = ["window-size=1280,900", "no-sandbox", "disable-dev-shm-usage",
              "disable-gpu", "disable-extensions", "remote-allow-origins=*"]
    }
  }
}
